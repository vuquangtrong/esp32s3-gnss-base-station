<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GNSS Station</title>
    <link rel="stylesheet" href="/pico.min.css" />
    <script defer src="/alpine.min.js"></script>
    <style>
      :root {
        --pico-spacing: 0.5rem;
        --pico-nav-element-spacing-vertical: var(--pico-spacing);
        --pico-nav-element-spacing-horizontal: var(--pico-spacing);
        --pico-form-element-spacing-vertical: var(--pico-spacing);
        --pico-form-element-spacing-horizontal: var(--pico-spacing);
      }

      header {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
      }

      .text-green {
        color: green;
      }

      .text-orange {
        color: darkorange;
      }

      .text-red {
        color: red;
      }

      .notification {
        color: red;
        background-color: lightyellow;
        border: solid 1px red;
        padding: var(--pico-spacing);
        white-space: pre-line;
      }
    </style>
  </head>

  <body x-data="app">
    <template x-if="message">
      <div class="container notification" x-text="message"></div>
    </template>

    <header class="container">
      <nav>
        <ul>
          <li><strong>GNSS Station</strong></li>
          <li x-show="heartbeat">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="8" cy="8" r="8" fill="darkcyan" />
            </svg>
          </li>
        </ul>
        <ul>
          <li>
            <strong :class="gnss_fix_class" x-text="status.gnss_fix"></strong>
          </li>
          <li>
            <span x-text="status.gnss_sat"></span>
            <img src="/favicon.ico" width="24" height="24" />
          </li>
          <li>
            <span x-text="bat_percent"></span>%
            <img x-bind:src="bat_volt_icon" width="24" height="24" />
          </li>
        </ul>
      </nav>
    </header>

    <main class="container grid">
      <!-- GNSS Position -->
      <article>
        <header>
          <nav>
            <ul>
              <li><strong>GNSS Position</strong></li>
            </ul>
            <ul>
              <li>
                <strong x-text="gnss_mode_text"></strong>
              </li>
            </ul>
          </nav>
        </header>

        <form>
          <div
            class="grid"
            style="grid-template-columns: 5rem 1fr; gap: 0; align-items: center"
          >
            <label>Latitude</label>
            <input x-bind:value="status.gnss_lat" readonly />

            <label>Longitude</label>
            <input x-bind:value="status.gnss_lon" readonly />
          </div>

          <div
            class="grid"
            style="
              grid-template-columns: 5rem 1fr 1rem 1fr;
              gap: 0;
              align-items: center;
            "
          >
            <label>Altitude</label>
            <input x-bind:value="status.gnss_alt" readonly />
            <div></div>
            <span>(m) ASL</span>
          </div>
          <div
            class="grid"
            style="grid-template-columns: 5rem 1fr; gap: 0; align-items: center"
          >
            <small>Datetime</small>
            <small x-text="datetime"></small>
          </div>
          <div
            class="grid"
            style="
              grid-template-columns: 5rem 1fr 2fr 1fr 2fr;
              gap: 0;
              align-items: center;
            "
          >
            <small>Accuracy</small>
            <small>hor</small>
            <small x-text="status.gnss_hacc"></small>
            <small>ver</small>
            <small x-text="status.gnss_vacc"></small>
          </div>
        </form>
      </article>

      <!-- WiFi Settings -->
      <article>
        <header>
          <nav>
            <ul>
              <li><strong>WiFi Settings</strong></li>
            </ul>
            <ul>
              <li :class="sta_status_class" x-text="sta_status_text"></li>
              <li x-text="status.sta_ip"></li>
            </ul>
          </nav>
        </header>

        <form @submit.prevent="wifiConnect()">
          <div
            class="grid"
            style="grid-template-columns: 5rem 1fr; gap: 0; align-items: center"
          >
            <label for="ssid">WiFi AP</label>
            <input
              id="ssid"
              x-model="config.wifi_ssid"
              autocomplete="on"
              required
            />

            <label for="password">Password</label>
            <input
              id="password"
              x-model="config.wifi_password"
              autocomplete="on"
              required
            />

            <div></div>
            <button type="submit" :disabled="is_sta_connecting">Connect</button>
          </div>
        </form>
      </article>
    </main>

    <footer class="container">
      <nav>
        <ul>
          <li>
            V<span x-text="config.prj_version"></span>
            <span x-text="config.build_date"></span>
            <span x-text="config.git_commit"></span>
          </li>
        </ul>
        <ul>
          <li><span x-text="status.bat_volt"></span>mV</li>
        </ul>
      </nav>
    </footer>

    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("app", () => ({
          config: {},
          status: {},
          heartbeat: false,
          message: "",

          setMessage(msg) {
            this.message = msg;
            if (msg) window.scrollTo(0, 0);
          },

          get bat_percent() {
            const volt = Number(this.status.bat_volt); // in range 1650-2100 mV
            return Math.max(
              0,
              Math.min(100, Math.round(((volt - 1650) / (2100 - 1650)) * 100)),
            );
          },

          get bat_volt_icon() {
            const volt = Number(this.status.bat_volt); // in range 1650-2100 mV
            if (volt >= 2000) return "/bat_100.png";
            if (volt >= 1900) return "/bat_75.png";
            if (volt >= 1800) return "/bat_50.png";
            if (volt >= 1700) return "/bat_25.png";
            return "/bat_0.png";
          },

          get gnss_fix_class() {
            return this.status.gnss_fix === "FIXED RTK"
              ? "text-green"
              : this.status.gnss_fix === "FLOAT RTK"
                ? "text-orange"
                : "text-red";
          },

          get gnss_mode_text() {
            const modes = ["ROVER", "BASE", "PPP"];
            return modes[this.status.gnss_mode] ?? "Unknown";
          },

          get sta_status_class() {
            const classes = ["text-red", "text-orange", "text-green"];
            return classes[this.status.sta_status] ?? "text-red";
          },

          get sta_status_text() {
            const statuses = ["Disconnected", "Connecting...", "Connected"];
            return statuses[this.status.sta_status] ?? "Disconnected";
          },

          get is_sta_connecting() {
            return Number(this.status.sta_status) === 1;
          },

          get datetime() {
            return this.status.gnss_date && this.status.gnss_time
              ? `${this.status.gnss_date} ${this.status.gnss_time}`
              : "";
          },

          async request(url, options = {}) {
            const opts = {
              ...options,
              signal: AbortSignal.timeout(5000),
              cache: "no-store",
            };
            try {
              const res = await fetch(url, opts);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.headers
                .get("content-type")
                ?.includes("application/json")
                ? await res.json()
                : true;
            } catch (err) {
              console.error(`Fetch failed (${url}):`, err);
              return null;
            }
          },

          async fetchConfig() {
            const data = await this.request("/config");
            console.log("Fetched config:", data);
            if (data) this.config = data;
          },

          async fetchStatus() {
            const data = await this.request("/status");
            console.log("Fetched status:", data);
            if (data) {
              this.status = data;
              this.heartbeat = !this.heartbeat;
              this.setMessage("");
            } else {
              this.status = {};
              this.heartbeat = false;
              this.setMessage(
                "Cannot connect to server.\nPlease check your connection.",
              );
            }
          },

          async wifiConnect() {
            const params = new URLSearchParams({
              command: "connect",
              ssid: this.config.wifi_ssid || "",
              password: this.config.wifi_password || "",
            });
            this.status.sta_status = 1;
            this.setMessage(
              "You may need to connect to the device's WiFi\nor the WiFi this device connects to.",
            );
            await this.request(`/wifi?${params}`, { method: "POST" });
          },

          async init() {
            await this.fetchConfig();
            await this.fetchStatus();
            setInterval(() => this.fetchStatus(), 3000);
          },
        }));
      });
    </script>
  </body>
</html>
