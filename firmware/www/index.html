<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GNSS Station</title>
  <link rel="stylesheet" href="pico.min.css" />
  <!-- Use Alpine.js 2.8.2 for better compability with old browsers -->
  <script defer src="alpine.min.js"></script>
  <style>
    :root {
      --pico-font-size: 100% !important;
      --pico-spacing: 0.5rem;
      --pico-nav-element-spacing-vertical: var(--pico-spacing);
      --pico-nav-element-spacing-horizontal: var(--pico-spacing);
      --pico-form-element-spacing-vertical: var(--pico-spacing);
      --pico-form-element-spacing-horizontal: var(--pico-spacing);
    }

    [role="group"] button {
      --pico-form-element-spacing-horizontal: var(--pico-spacing);
    }

    header {
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }

    summary {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    summary> :nth-child(2) {
      margin-left: auto;
    }

    input,
    select {
      font-weight: bold;
    }

    .text-green {
      color: green;
    }

    .text-orange {
      color: darkorange;
    }

    .text-red {
      color: red;
    }

    .notification {
      color: red;
      background-color: lightyellow;
      border: solid 1px red;
      padding: var(--pico-spacing);
      white-space: pre-line;
    }

    .small-button {
      padding: inherit;
    }

    dialog article {
      padding: 1rem;
    }

    dialog footer {
      display: flex;
      gap: 1rem;
    }

    dialog footer button {
      flex: 1;
      margin-bottom: 0;
    }
  </style>
</head>

<body x-data="app()" x-init="init()">
  <template x-if="notification">
    <div class="container notification" x-text="notification"></div>
  </template>

  <!-- General Confirmation / Input / Message Dialog -->
  <dialog :open="dialog.open">
    <article>
      <h4 x-text="dialog.message"></h4>
      <template x-if="dialog.hasInput">
        <input x-model="dialog.inputValue" :placeholder="dialog.placeholder" />
      </template>
      <footer>
        <button class="outline" x-show="dialog.hasConfirm" @click="closeConfirm(false)">Không</button>
        <button x-show="dialog.hasConfirm" @click="closeConfirm(true)">Có</button>
        <button x-show="!dialog.hasConfirm" @click="closeConfirm(false)">OK</button>
      </footer>
    </article>
  </dialog>

  <!-- Status Bar -->
  <header class="container">
    <nav>
      <ul>
        <li>
          <kbd><span x-text="gnss_mode_text(status.gnss_mode)"></span></kbd>
        </li>
        <li>
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
            :style="heartbeat ? 'visibility: visible' : 'visibility: hidden'">
            <circle cx="8" cy="8" r="8" fill="darkcyan" />
          </svg>
        </li>
      </ul>
      <ul>
        <li>
          <strong x-text="config.device_id"></strong>
        </li>
      </ul>
      <ul>
        <li>
          <strong x-text="gnss.fix_status" :class="gnss_fix_status_class(gnss.fix_status)"></strong>
        </li>
        <li>
          <strong x-text="gnss.sat_num"></strong>
          <img src="favicon.ico" width="24" height="24" />
        </li>
        <li>
          <strong x-text="bat_volt_text(status.bat_volt)"></strong>%
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">

    <!-- GNSS Position, always show -->
    <details open>
      <summary role="button" class="outline contrast">
        <strong>Tọa độ GNSS</strong>
        <span x-text="gnss.date_time"></span>
      </summary>

      <div class="grid" style="grid-template-columns: 7rem 1fr; gap: 0; align-items: baseline">
        <label>Vĩ độ (Lat)</label>
        <input readonly x-model="gnss.latitude" />

        <label>Kinh độ (Lon)</label>
        <input readonly x-model="gnss.longitude" />

        <label>Độ cao</label>
        <input readonly x-model="gnss.height" />

        <label></label>
        <div class="grid" style="grid-template-columns: 3ch 1fr 3ch 1fr; gap: 0; align-items: baseline">
          <small>ΔH</small>
          <small x-text="gnss.h_acc"></small>
          <small>ΔV</small>
          <small x-text="gnss.v_acc"></small>
        </div>
      </div>
    </details>

    <!-- Display Mode Buttons, always show -->
    <div role="group">
      <button :class="displayMode === 'rover' ? 'primary' : 'outline'" @click="setDisplayMode('rover')">Rover</button>
      <button :class="displayMode === 'base' ? 'primary' : 'outline'" @click="setDisplayMode('base')">Base</button>
      <button :class="displayMode === 'ppp' ? 'primary' : 'outline'" @click="setDisplayMode('ppp')">PPP</button>
    </div>

    <!-- Rover Settings, show when Rover mode -->
    <details open x-show="displayMode === 'rover'">
      <summary role="button" class="outline contrast">
        <strong>Cài đặt Rover</strong>
        <button class="outline" @click.stop="setGnssMode('rover')">Kích hoạt chế độ Rover</button>
      </summary>
    </details>

    <!-- NTRIP Client, show in Rover mode -->
    <details open x-show="displayMode === 'rover'">
      <summary role="button" class="outline contrast">
        <strong>NTRIP Client</strong>
        <span x-text="conn_status_text(status.ntrip_client_status)"
          :class="conn_status_class(status.ntrip_client_status)">
        </span>
        <span x-text="file_size_text(status.ntrip_received_bytes)"></span>
      </summary>

      <div class="grid" style="grid-template-columns: 7rem 1fr; gap: 0; align-items: center">
        <label>Máy chủ</label>
        <input required x-model="config.ntrip_server" />

        <label>Cổng</label>
        <div class="grid" style="grid-template-columns: 2fr 1fr; align-items: baseline">
          <input required x-model="config.ntrip_port" />
        </div>

        <label>Điểm phát</label>
        <div class="grid" style="grid-template-columns: 2fr 1fr; align-items: baseline">
          <input required x-model="config.ntrip_mntpoint" list="ntrip_mntpoint_list" autocomplete="off"
            :placeholder="prev_mntpoint" @focus="onMntpointFocus()" @click="onMntpointFocus()"
            @blur="onMntpointBlur()" />
          <datalist id="ntrip_mntpoint_list">
            <template x-for="(mp, idx) in ntrip_mntpoint_list" :key="idx">
              <option :value="mp" x-text="mp"></option>
            </template>
          </datalist>
          <button class="outline" :disabled="status.ntrip_client_status !== 0" @click="ntripClientQueryMntpoints()">
            Tra cứu</button>
        </div>

        <label>Tài khoản</label>
        <input required x-model="config.ntrip_username" />

        <label>Mật khẩu</label>
        <input required x-model="config.ntrip_password" />
      </div>
      <div class="grid" style="grid-template-columns: 1fr 1fr; align-items: baseline">
        <button class="outline" @click="ntripClientSave()">Lưu</button>
        <button class="outline" @click="ntripClientToggleConnection()"
          x-text="button_text_ntrip_client_toggle(status.ntrip_client_status)"></button>
      </div>

      <hr />
      <!-- List of saved Ntrip connections -->
      <template x-if="saved_ntrip_list.length > 0">
        <div style="max-height: 14rem; overflow-x: auto; overflow-y: auto">
          <table>
            <thead>
              <tr>
                <th><small>Máy chủ</small></th>
                <th><small>Cổng</small></th>
                <th><small>Điểm phát</small></th>
                <th><small>Tài khoản</small></th>
                <th><small>Mật khẩu</small></th>
                <th style="width: 8ch;"><small>Thao tác</small></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(n, idx) in saved_ntrip_list" :key="idx">
                <tr>
                  <td>
                    <small x-text="n.server"></small>
                  </td>
                  <td>
                    <small x-text="n.port"></small>
                  </td>
                  <td>
                    <small x-text="n.mntpoint"></small>
                  </td>
                  <td>
                    <small x-text="n.username"></small>
                  </td>
                  <td>
                    <small x-text="n.password"></small>
                  </td>
                  <td style="white-space: nowrap">
                    <button class="primary small-button" @click="ntripItemApply(n)">&check;</button>
                    <button class="outline small-button text-red" @click="ntripItemDelete(idx)">&times;</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </details>

    <!-- Base Settings, show when Base mode -->
    <details open x-show="displayMode === 'base'">
      <summary role="button" class="outline contrast">
        <strong>Cài đặt Base</strong>
        <button class="outline" @click.stop="setGnssMode('base')">Kích hoạt chế độ Base</button>
      </summary>

      <div class="grid" style="grid-template-columns: 7rem 1fr; gap: 0; align-items: baseline">
        <label>Vĩ độ (Lat)</label>
        <input required x-model="config.base_lat" />

        <label>Kinh độ (Lon)</label>
        <input required x-model="config.base_lon" />

        <label>Độ cao</label>
        <input required x-model="config.base_height" />
      </div>

      <div class="grid" style="grid-template-columns: 1fr 1fr; align-items: baseline">
        <button class="outline" @click="baseSave()">Lưu</button>
        <button class="outline" @click="setBaseAtCurrentPosition()">Dùng tọa độ hiện tại</button>
      </div>

      <hr />
      <!-- List of saved Base positions -->
      <template x-if="saved_base_list.length > 0">
        <div style="max-height: 14rem; overflow-x: auto; overflow-y: auto">
          <table>
            <thead>
              <tr>
                <th><small>Tên</small></th>
                <th><small>Vĩ độ (Lat)</small></th>
                <th><small>Kinh độ (Lon)</small></th>
                <th><small>Độ cao</small></th>
                <th style="width: 8ch;"><small>Thao tác</small></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(b, idx) in saved_base_list" :key="idx">
                <tr>
                  <td>
                    <small x-text="b.name"></small>
                  </td>
                  <td>
                    <small x-text="b.lat"></small>
                  </td>
                  <td>
                    <small x-text="b.lon"></small>
                  </td>
                  <td>
                    <small x-text="b.height"></small>
                  </td>
                  <td style="white-space: nowrap">
                    <button class="primary small-button" @click="baseItemApply(b)">&check;</button>
                    <button class="outline small-button text-red" @click="baseItemDelete(idx)">&times;</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </details>

    <!-- NTRIP Caster, show when Base mode -->
    <details open x-show="displayMode === 'base'">
      <summary role="button" class="outline contrast">
        <strong>NTRIP Caster</strong>
        <span x-text="conn_status_text(status.ntrip_server_status)"
          :class="conn_status_class(status.ntrip_server_status)">
        </span>
        <strong x-text="status.ntrip_conn_count"></strong>:
        <span x-text="file_size_text(status.ntrip_sent_bytes)"></span>
      </summary>

      <div class="grid" style="grid-template-columns: 7rem 1fr; gap: 0; align-items: center">
        <label>Máy chủ</label>
        <input readonly :value="status.wifi_ip_addr ? '192.168.4.1 / ' + status.wifi_ip_addr : '192.168.4.1'" />

        <label>Cổng</label>
        <input readonly value="2101" />

        <label>Điểm phát</label>
        <input readonly value="BASE" />

        <label>Tài khoản</label>
        <input readonly value="BASE" />

        <label>Mật khẩu</label>
        <input readonly value="BASE" />
      </div>
    </details>

    <!-- PPP Settings, show when PPP mode -->
    <details open x-show="displayMode === 'ppp'">
      <summary role="button" class="outline contrast">
        <strong>Cài đặt PPP</strong>
        <button class="outline" @click.stop="setGnssMode('ppp')">Kích hoạt chế độ PPP</button>
      </summary>

      <div class="grid" style="grid-template-columns: 7rem 1fr; gap: 0; align-items: baseline">
        <label>Thời gian đo</label>
        <div class="grid" style="grid-template-columns: 1fr 4rem; align-items: baseline">
          <input required x-model="config.ppp_min_dur" />
          <span>giây</span>
        </div>

        <label>Độ chính xác</label>
        <div class="grid" style="grid-template-columns: 1fr 4rem; align-items: baseline">
          <input required x-model="config.ppp_acc_limit" />
          <span>mm</span>
        </div>
      </div>
    </details>

    <!-- Logger, show when PPP mode -->
    <details open x-show="displayMode === 'ppp'">
      <summary role="button" class="outline contrast">
        <strong>Ghi dữ liệu</strong>
        <span x-text="logger_status_text(status.logger_status)" :class="logger_status_class(status.logger_status)">
        </span>
      </summary>

      <div class="grid" style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center">
        <label>Tệp log</label>
        <input readonly x-model="status.logger_file" />

        <label>Dung lượng</label>
        <input readonly :value="file_size_text(status.logger_size)" />

        <div></div>
        <div class="grid">
          <span></span>
          <button class="outline" @click="loggerToggleLogging()"
            :disabled="status.sdcard_status !== 1 || status.gnss_mode !== 2"
            x-text="button_text_logger_toggle(status.logger_status)"></button>
        </div>
      </div>
    </details>

    <!-- WiFi Settings, always show -->
    <details open>
      <summary role="button" class="outline contrast">
        <strong>WiFi</strong>
        <span x-text="conn_status_text(status.wifi_status)" :class="conn_status_class(status.wifi_status)"></span>
        <span x-text="status.wifi_ip_addr"></span>
      </summary>

      <div class="grid" style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center">
        <label>WiFi</label>
        <input required x-model="config.wifi_ssid" />

        <label>Mật khẩu</label>
        <input required x-model="config.wifi_password" />
      </div>

      <div class="grid" style="grid-template-columns: 1fr 1fr; align-items: baseline">
        <button class="outline" @click="wifiSave()">Lưu</button>
        <button class="outline" @click="wifiConnect()">Kết nối</button>
      </div>

      <hr />
      <!-- List of saved WiFi points -->
      <template x-if="saved_wifi_list.length > 0">
        <div style="max-height: 14rem; overflow-x: auto; overflow-y: auto">
          <table>
            <thead>
              <tr>
                <th><small>WiFi</small></th>
                <th><small>Mật khẩu</small></th>
                <th style="width: 8ch;"><small>Thao tác</small></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(w, idx) in saved_wifi_list" :key="idx">
                <tr>
                  <td>
                    <small x-text="w.ssid"></small>
                  </td>
                  <td>
                    <small x-text="w.password"></small>
                  </td>
                  <td style="white-space: nowrap">
                    <button class="primary small-button" @click="wifiItemApply(w)">&check;</button>
                    <button class="outline small-button text-red" @click="wifiItemDelete(idx)">&times;</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </details>

    <!-- SDCard, always show -->
    <details open>
      <summary role="button" class="outline contrast">
        <strong>Thẻ nhớ SD</strong>
        <span x-text="sdcard_status_text(status.sdcard_status)" :class="sdcard_status_class(status.sdcard_status)">
        </span>
      </summary>

      <!-- List of UBX files on SDCard -->
      <template x-if="ubx_files_list.length > 0">
        <div style="max-height: 14rem; overflow-x: auto; overflow-y: auto">
          <table>
            <thead>
              <tr>
                <th><small>File</small></th>
                <th><small>Kích thước</small></th>
                <th style="width: 8ch;"><small>Thao tác</small></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(w, idx) in ubx_files_list" :key="idx">
                <tr>
                  <td>
                    <small x-text="w.name"></small>
                  </td>
                  <td>
                    <small x-text="file_size_text(w.size)"></small>
                  </td>
                  <td style="white-space: nowrap">
                    <a download role="button" class="primary small-button"
                      :href="'/download/' + encodeURIComponent(w.name)">&darr;</a>
                    <button class="outline small-button text-red" @click="ubxFileItemDelete(idx)">&times;</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </details>

    <!-- System, always show -->
    <details>
      <summary role="button" class="outline contrast">
        <strong>Hệ thống</strong>
        <span></span>
      </summary>

      <div class="grid" style="grid-template-columns: 1fr 1fr; align-items: baseline">
        <span></span>
        <button class="outline" x-show="status.fw_update_available" :disabled="status.fw_update_status !== 0"
          :class="fw_update_status_class(status.fw_update_status)" @click="updateFirmware()"
          x-text="fw_update_status_text(status.fw_update_status)"></button>
      </div>
    </details>
  </main>

  <footer class="container">
    <nav>
      <ul>
        <li>
          <small>
            <span x-text="config.app_version"></span>
            <span x-text="config.build_time"></span>
            <span x-text="config.git_commit"></span>
          </small>
        </li>
      </ul>
      <ul>
        <li>
          <small><span x-text="status.bat_volt"></span>mV</small>
        </li>
      </ul>
    </nav>
  </footer>

  <!-- Use ES5 Javascript for better compatibility with old browsers -->
  <script>
    /* Format single-digit numbers with a leading zero */
    function pad2(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    function app() {
      return {
        heartbeat: false,
        notification: "",
        displayMode: "rover",
        config: {}, /* fields are defined in config.c */
        status: {}, /* fields are defined in status.c */
        saved_wifi_list: [],
        saved_ntrip_list: [],
        saved_base_list: [],
        ubx_files_list: [],
        ntrip_mntpoint_list: [],
        prev_mntpoint: "",
        dialog: {
          open: false,
          message: "",
          hasConfirm: false,
          onConfirm: null,
          hasInput: false,
          inputValue: "",
          placeholder: ""
        },
        gnss: {
          fix_status: "NO FIX",
          sat_num: 0,
          date_time: "",
          date_time_file: "",
          latitude: "",
          longitude: "",
          height: "",
          h_acc: "",
          v_acc: ""
        },
        ws: null,
        wsLastTimestamp: 0,
        ubxBuf: [],

        /* General confirmation, prompt and message dialog helpers */
        openDialog: function (msg, hasConfirm, hasInput, placeholder, callback) {
          this.dialog.open = true;
          this.dialog.message = msg;
          this.dialog.hasConfirm = hasConfirm;
          this.dialog.onConfirm = (typeof callback === "function") ? callback : null;
          this.dialog.hasInput = hasInput;
          this.dialog.inputValue = "";
          this.dialog.placeholder = placeholder || "";
        },

        askConfirm: function (msg, callback) {
          this.openDialog(msg, true, false, "", callback);
        },

        askInput: function (msg, placeholder, callback) {
          this.openDialog(msg, true, true, placeholder, callback);
        },

        showMessage: function (msg, onOk) {
          this.openDialog(msg, false, false, "", onOk);
        },

        closeConfirm: function (confirmed) {
          var cb = this.dialog.onConfirm;
          var val = this.dialog.inputValue;
          var hasInput = this.dialog.hasInput;
          var hasConfirm = this.dialog.hasConfirm;
          this.openDialog("", false, false, "", null);
          this.dialog.open = false;
          if ((confirmed || !hasConfirm) && typeof cb === "function") {
            if (hasInput) {
              cb(val);
            } else {
              cb();
            }
          }
        },

        /* Reusable XMLHttpRequest helper for older browser compatibility */
        httpRequest: function (method, url, data, onSuccess, onError) {
          var xhr = new XMLHttpRequest();
          xhr.open(method, url, true);
          if (data !== null && data !== undefined) {
            xhr.setRequestHeader("Content-Type", "application/json");
          }
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status >= 200 && xhr.status < 300) {
              var res = null;
              if (xhr.responseText) {
                try {
                  res = JSON.parse(xhr.responseText);
                } catch (e) {
                  console.error("Invalid JSON response:", e);
                }
              }
              if (typeof onSuccess === "function") {
                onSuccess(res);
              }
            } else {
              console.error("HTTP " + method + " " + url + " failed: " + xhr.status);
              if (typeof onError === "function") {
                onError(xhr.status);
              }
            }
          };
          xhr.send((data !== null && data !== undefined) ? JSON.stringify(data) : null);
        },

        /* Trim leading/trailing whitespace (ES5 compatible) */
        trimText: function (value) {
          return (value === null || value === undefined ? "" : "" + value).replace(/^\s+|\s+$/g, "");
        },

        /* Validate the optional filename prefix: empty or a safe short name */
        validLoggerPrefix: function (prefix) {
          if (prefix.length > 24) return false;
          return /^[A-Za-z0-9_-]*$/.test(prefix);
        },

        /* Ask for a filename prefix, then start logging with a datetime suffix */
        askLoggerFilename: function () {
          var self = this;
          this.askInput("Nhập tên tệp log (có thể để trống):", "Tên tệp", function (value) {
            var prefix = self.trimText(value);
            if (!self.validLoggerPrefix(prefix)) {
              self.showMessage("Tên tệp không hợp lệ. Chỉ dùng chữ cái, số, dấu '_' hoặc '-', tối đa 24 ký tự.", function () {
                self.askLoggerFilename();
              });
              return;
            }
            var stamp = self.trimText(self.gnss.date_time_file);
            if (!/^\d{8}_\d{6}$/.test(stamp)) {
              self.showMessage("Chưa có thời gian GNSS. Không thể bắt đầu ghi.");
              return;
            }
            var file = (prefix ? prefix + "_" : "") + stamp + ".ubx";
            self.httpRequest("POST", "/api/logger", {
              command: "start",
              file: file
            }, function () {
              self.fetchUbxFiles();
            }, function () {
              self.showMessage("Không thể bắt đầu ghi dữ liệu.");
            });
          });
        },

        /* Start or stop writing RAW UBX data from UART2 to the SD card */
        loggerToggleLogging: function () {
          var self = this;
          if (this.status.logger_status === 1) {
            this.askConfirm("Dừng ghi dữ liệu?", function () {
              self.httpRequest("POST", "/api/logger", {
                command: "stop"
              }, function () {
                self.fetchUbxFiles();
              }, function () {
                self.showMessage("Không thể dừng ghi dữ liệu.");
              });
            });
            return;

        /* Parse 92-byte UBX-NAV-PVT (0x01 0x07) payload (little-endian) */
        decodeUbxNavPvt: function (payload) {
          var dv = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
          var year = dv.getUint16(4, true);
          var month = dv.getUint8(6);
          var day = dv.getUint8(7);
          var hour = dv.getUint8(8);
          var min = dv.getUint8(9);
          var sec = dv.getUint8(10);

          var fixType = dv.getUint8(20);
          var flags = dv.getUint8(21);
          var gnssFixOK = (flags & 0x01) !== 0;
          var diffSoln = (flags & 0x02) !== 0;
          var carrSoln = (flags >> 6) & 0x03;

          var numSV = dv.getUint8(23);
          var lon = dv.getInt32(24, true) * 1e-7;
          var lat = dv.getInt32(28, true) * 1e-7;
          var height = dv.getInt32(32, true) / 1000.0;
          var hAcc = dv.getUint32(40, true) / 1000.0;
          var vAcc = dv.getUint32(44, true) / 1000.0;

          var fixText = "NO FIX";
          if (gnssFixOK) {
            if (carrSoln === 2) {
              fixText = "RTK FIXED";
            } else if (carrSoln === 1) {
              fixText = "RTK FLOAT";
            } else if (diffSoln) {
              fixText = "DGNSS";
            } else if (fixType === 3) {
              fixText = "3D FIX";
            } else if (fixType === 2) {
              fixText = "2D FIX";
            } else if (fixType === 5) {
              fixText = "TIME FIX";
            }
          }

          this.gnss.date_time = year + "-" + pad2(month) + "-" + pad2(day) + " " + pad2(hour) + ":" + pad2(min) + ":" + pad2(sec);
          this.gnss.date_time_file = year + pad2(month) + pad2(day) + "_" + pad2(hour) + pad2(min) + pad2(sec);
          this.gnss.fix_status = fixText;
          this.gnss.sat_num = numSV;
          this.gnss.latitude = lat.toFixed(9);
          this.gnss.longitude = lon.toFixed(9);
          this.gnss.height = height.toFixed(4);
          this.gnss.h_acc = hAcc.toFixed(3);
          this.gnss.v_acc = vAcc.toFixed(3);
        },

        /* Accumulate binary stream and extract valid UBX frames */
        feedUbxBytes: function (arrayBuffer) {
          var bytes = new Uint8Array(arrayBuffer);
          var i;
          for (i = 0; i < bytes.length; i++) {
            this.ubxBuf.push(bytes[i]);
          }

          /* Cap buffer size to prevent unbounded growth */
          if (this.ubxBuf.length > 4096) {
            this.ubxBuf.splice(0, this.ubxBuf.length - 2048);
          }

          /* Minimum UBX frame is 8 bytes: 2 sync + 1 class + 1 id + 2 length + 2 checksum */
          while (this.ubxBuf.length >= 8) {
            /* Look for UBX sync chars (0xB5 0x62) */
            if (this.ubxBuf[0] !== 0xB5 || this.ubxBuf[1] !== 0x62) {
              this.ubxBuf.shift();
              continue;
            }

            var cls = this.ubxBuf[2];
            var id = this.ubxBuf[3];
            var len = this.ubxBuf[4] | (this.ubxBuf[5] << 8);

            /* Reject corrupted payload length */
            if (len > 1024) {
              this.ubxBuf.shift();
              continue;
            }

            var frameLen = 6 + len + 2;
            if (this.ubxBuf.length < frameLen) {
              break; /* Wait for remaining bytes */
            }

            /* Verify 8-bit Fletcher checksum over class, id, length, and payload */
            var ckA = 0;
            var ckB = 0;
            for (i = 2; i < 6 + len; i++) {
              ckA = (ckA + this.ubxBuf[i]) & 0xFF;
              ckB = (ckB + ckA) & 0xFF;
            }

            if (ckA === this.ubxBuf[6 + len] && ckB === this.ubxBuf[6 + len + 1]) {
              /* Match UBX-NAV-PVT (class 0x01, id 0x07, length 92) */
              if (cls === 0x01 && id === 0x07 && len === 92) {
                var payload = new Uint8Array(92);
                for (i = 0; i < 92; i++) {
                  payload[i] = this.ubxBuf[6 + i];
                }
                this.decodeUbxNavPvt(payload);
              }
              this.ubxBuf.splice(0, frameLen);
            } else {
              this.ubxBuf.shift();
            }
          }
        },

          this.showMessage("Đã lấy tọa độ hiện tại làm tọa độ Base.");
        },

        /* Trigger firmware update from SD card with confirmation prompt */
        updateFirmware: function () {
          var self = this;
          if (!this.status.fw_update_available || this.status.fw_update_status !== 0) return;
          this.askConfirm("Cập nhật phần mềm?", function () {
            self.httpRequest("POST", "/api/firmware", null, null, function () {
              self.showMessage("Không thể bắt đầu cập nhật phần mềm.");
            });
          });
        },

        /* Connect to WebSocket for real-time JSON status and binary UBX stream */
        connectWebSocket: function (isReconnect) {
          var self = this;
          if (self.ws) {
            self.ws.onopen = null;
            self.ws.onmessage = null;
            self.ws.onclose = null;
            self.ws.onerror = null;
            try {
              self.ws.close();
            } catch (e) { }
            self.ws = null;
          }

          var proto = (window.location.protocol === "https:") ? "wss:" : "ws:";
          var wsUrl = proto + "//" + window.location.host + "/ws";
          var ws;
          try {
            ws = new WebSocket(wsUrl);
          } catch (e) {
            console.error("WS create error:", e);
            self.heartbeat = false;
            self.notification = "Mất kết nối đến thiết bị";
            return;
          }
          ws.binaryType = "arraybuffer";
          self.ws = ws;
          self.wsLastTimestamp = Date.now();

          ws.onopen = function () {
            self.notification = "";
            self.wsLastTimestamp = Date.now();
            if (isReconnect) {
              self.fetchConfig();
              self.fetchUbxFiles();
            }
          };

          ws.onmessage = function (evt) {
            self.heartbeat = !self.heartbeat;
            self.wsLastTimestamp = Date.now();
            if (typeof evt.data === "string") {
              try {
                var newStatus = JSON.parse(evt.data);
                var prevSdcardStatus = self.status.sdcard_status;
                var prevLoggerStatus = self.status.logger_status;
                self.status = newStatus;
                /* Reload the UBX file list whenever the SD card or logger state changes */
                if (newStatus.sdcard_status !== prevSdcardStatus || newStatus.logger_status !== prevLoggerStatus) {
                  if (newStatus.sdcard_status === 1) {
                    self.fetchUbxFiles();
                  } else {
                    self.ubx_files_list = [];
                  }
                }
              } catch (e) {
                console.error("Invalid status JSON:", e);
              }
            } else if (evt.data instanceof ArrayBuffer) {
              self.feedUbxBytes(evt.data);
            }
          };

          ws.onclose = function () {
            self.heartbeat = false;
            self.notification = "Mất kết nối đến thiết bị";
            self.ws = null;
          };

          ws.onerror = function () {
            self.heartbeat = false;
            self.notification = "Mất kết nối đến thiết bị";
            try {
              ws.close();
            } catch (e) { }
            self.ws = null;
          };
        },

        init: function () {
          var self = this;
          this.fetchConfig();
          this.fetchUbxFiles();
          this.fetchWifiList();
          this.fetchNtripList();
          this.fetchBaseList();
          this.connectWebSocket(false);
          setInterval(function () {
            if (!self.ws || self.ws.readyState === 2 || self.ws.readyState === 3 || (Date.now() - self.wsLastTimestamp > 10000)) {
              self.heartbeat = false;
              self.notification = "Mất kết nối đến thiết bị";
              self.connectWebSocket(true);
            }
          }, 10000);
        }
      };
    }
  </script>
