<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GNSS Station</title>
    <link rel="stylesheet" href="pico.min.css" />
    <script defer src="alpine.min.js"></script>
    <style>
      :root {
        --pico-font-size: 100% !important;
        --pico-spacing: 0.5rem;
        --pico-nav-element-spacing-vertical: var(--pico-spacing);
        --pico-nav-element-spacing-horizontal: var(--pico-spacing);
        --pico-form-element-spacing-vertical: var(--pico-spacing);
        --pico-form-element-spacing-horizontal: var(--pico-spacing);
      }

      [role="group"] button {
        --pico-form-element-spacing-horizontal: var(--pico-spacing);
      }

      header {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
      }

      summary {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      summary > :nth-child(2) {
        margin-left: auto;
      }

      input,
      select {
        font-weight: bold;
      }

      .text-green {
        color: green;
      }

      .text-orange {
        color: darkorange;
      }

      .text-red {
        color: red;
      }

      .notification {
        color: red;
        background-color: lightyellow;
        border: solid 1px red;
        padding: var(--pico-spacing);
        white-space: pre-line;
      }
    </style>
  </head>

  <body x-data="app">
    <template x-if="message">
      <div class="container notification" x-text="message"></div>
    </template>

    <!-- Status Bar -->
    <header class="container">
      <nav>
        <ul>
          <li>
            <kbd><span x-text="gnss_mode_text"></span></kbd>
            <svg
              x-show="heartbeat"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="8" cy="8" r="8" fill="darkcyan" />
            </svg>
          </li>
        </ul>
        <ul>
          <li>
            <strong :class="gnss_fix_class" x-text="status.gnss_fix"></strong>
          </li>
          <li>
            <span x-text="status.gnss_sat"></span>
            <img src="favicon.ico" width="24" height="24" />
          </li>
          <li><span x-text="bat_percent_text"></span>%</li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <!-- GNSS Position, always show -->
      <details name="card_gnss_position" open>
        <summary role="button" class="outline contrast">
          <strong x-text="t('gnss_position')">Tọa độ GNSS</strong>
          <span></span>
        </summary>

        <div
          class="grid"
          style="grid-template-columns: 6rem 1fr; gap: 0; align-items: baseline"
        >
          <label x-text="t('latitude')">Vĩ độ</label>
          <input x-model="gnss_lat_text" readonly />

          <label x-text="t('longitude')">Kinh độ</label>
          <input x-model="gnss_lon_text" readonly />

          <label x-text="t('height')">Độ cao</label>
          <div
            class="grid"
            style="
              grid-template-columns: 2fr 0.5rem 1rem 2rem 1fr 2rem 1fr;
              gap: 0;
              align-items: baseline;
            "
          >
            <input x-model="gnss_height_text" readonly />
            <span></span>
            <span>m</span>
            <span style="margin-left: auto">ΔH</span>
            <span x-text="gnss_hacc_text" style="margin-left: auto"></span>
            <span style="margin-left: auto">ΔV</span>
            <span x-text="gnss_vacc_text" style="margin-left: auto"></span>
          </div>

          <label x-text="t('time')">Thời gian</label>
          <input x-model="gnss_time_text" readonly style="border: none" />
        </div>
      </details>

      <!-- Display Mode Buttons, always show -->
      <div role="group">
        <button
          @click="setDisplayMode('rover')"
          :class="displayMode === 'rover' ?  'secondary' : 'outline'"
          x-text="t('rover')"
        >
          Rover
        </button>
        <button
          @click="setDisplayMode('base')"
          :class="displayMode === 'base' ?  'secondary' : 'outline'"
          x-text="t('base')"
        >
          Base
        </button>
        <button
          @click="setDisplayMode('ppp')"
          :class="displayMode === 'ppp' ?  'secondary' : 'outline'"
          x-text="t('ppp')"
        >
          PPP
        </button>
      </div>

      <!-- Rover Settings, show when Rover mode -->
      <details name="card_rover_settings" open x-show="displayMode === 'rover'">
        <summary role="button" class="outline contrast">
          <strong x-text="t('rover_settings')">Cài đặt Rover</strong>
          <button
            :class="'outline'"
            @click="setGnssMode('rover')"
            x-text="t('activate_rover_mode')"
          >
            Kích hoạt chế độ Rover
          </button>
        </summary>
      </details>

      <!-- NTRIP Client, show in Rover mode -->
      <details name="card_ntrip_client" x-show="displayMode === 'rover'">
        <summary role="button" class="outline contrast">
          <strong x-text="t('ntrip_client')">NTRIP Client</strong>
          <span
            :class="ntrip_status_class"
            x-text="ntrip_client_status_text"
          ></span>
          <span
            :class="ntrip_status_class"
            x-text="ntrip_received_bytes_text"
          ></span>
        </summary>

        <div
          class="grid"
          style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center"
        >
          <label x-text="t('server')">Máy chủ</label>
          <input x-model="config.ntrip_server" autocomplete="on" required />

          <label x-text="t('port')">Cổng</label>
          <div
            class="grid"
            style="grid-template-columns: 2fr 1fr; align-items: baseline"
          >
            <input x-model="config.ntrip_port" autocomplete="on" required />
          </div>

          <label x-text="t('mountpoint')">Mountpoint</label>
          <div
            class="grid"
            style="grid-template-columns: 2fr 1fr; align-items: baseline"
          >
            <select x-model="config.ntrip_mountpoint">
              <option
                :value="config.ntrip_mountpoint"
                x-text="config.ntrip_mountpoint"
              ></option>
              <template x-for="mp in ntrip_mountpoints" :key="mp">
                <option :value="mp" x-text="mp"></option>
              </template>
            </select>
            <button
              :class="'outline'"
              @click="ntripClientQueryMountpoints()"
              x-text="t('query')"
            >
              Tra cứu
            </button>
          </div>

          <label x-text="t('username')">Tài khoản</label>
          <input x-model="config.ntrip_username" autocomplete="on" required />

          <label x-text="t('password')">Mật khẩu</label>
          <input x-model="config.ntrip_password" autocomplete="on" required />
        </div>
        <div
          class="grid"
          style="grid-template-columns: 1fr 1fr; align-items: baseline"
        >
          <!-- Save NTRIP Client to a file -->
          <button
            :class="'outline'"
            @click="ntripClientSave()"
            x-text="t('save')"
          >
            Lưu
          </button>
          <button
            :class="'outline'"
            :disabled="is_ntrip_client_connecting"
            @click="ntripClientToggleConnection()"
            x-text="ntrip_button_text"
          ></button>
        </div>

        <hr />
        <!-- List of saved NTRIP Client settings -->
        <template x-if="saved_ntrip_clients.length > 0">
          <div style="max-height: 14rem; overflow-x: auto; overflow-y: auto">
            <table>
              <thead>
                <tr>
                  <th><small x-text="t('server')">Máy chủ</small></th>
                  <th><small x-text="t('port')">Cổng</small></th>
                  <th><small x-text="t('mountpoint')">Mountpoint</small></th>
                  <th><small x-text="t('user')">Tài khoản</small></th>
                  <th><small x-text="t('actions')">Thao tác</small></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(item, idx) in saved_ntrip_clients" :key="idx">
                  <tr>
                    <td><small x-text="item.server"></small></td>
                    <td><small x-text="item.port"></small></td>
                    <td><small x-text="item.mountpoint"></small></td>
                    <td><small x-text="item.username"></small></td>
                    <td style="white-space: nowrap">
                      <button
                        style="
                          padding: 0.1rem 0.4rem;
                          font-size: 0.75rem;
                          margin-right: 0.25rem;
                          display: inline-block;
                          width: auto;
                        "
                        @click="ntripClientApply(item)"
                        x-text="t('apply')"
                      >
                        Áp dụng
                      </button>
                      <button
                        class="outline secondary"
                        style="
                          padding: 0.1rem 0.4rem;
                          font-size: 0.75rem;
                          display: inline-block;
                          width: auto;
                        "
                        @click="ntripClientDelete(idx)"
                      >
                        X
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </details>

      <!-- Base Settings, show when Base mode -->
      <details name="card_base_settings" open x-show="displayMode === 'base'">
        <summary role="button" class="outline contrast">
          <strong x-text="t('base_settings')">Cài đặt Base</strong>
          <button
            :class="'outline'"
            @click="setGnssMode('base')"
            x-text="t('activate_base_mode')"
          >
            Kích hoạt chế độ Base
          </button>
        </summary>

        <div
          class="grid"
          style="grid-template-columns: 6rem 1fr; gap: 0; align-items: baseline"
        >
          <label x-text="t('latitude')">Vĩ độ</label>
          <input x-model="config.base_lat" />

          <label x-text="t('longitude')">Kinh độ</label>
          <input x-model="config.base_lon" />

          <label x-text="t('height')">Độ cao</label>
          <div
            class="grid"
            style="grid-template-columns: 1fr 1rem; align-items: baseline"
          >
            <input x-model="config.base_height" />
            <span>m</span>
          </div>

          <div></div>
        </div>

        <div
          class="grid"
          style="grid-template-columns: 1fr 1fr; align-items: baseline"
        >
          <!-- Save Base Point to a file -->
          <button :class="'outline'" @click="baseSave()" x-text="t('save')">
            Lưu
          </button>
          <button
            :class="'outline'"
            @click="setBaseAtCurrentPosition()"
            x-text="t('use_current_position')"
          >
            Dùng tọa độ hiện tại
          </button>
        </div>

        <hr />
        <!-- List of saved Base Points -->
        <template x-if="saved_base_points.length > 0">
          <div style="max-height: 14rem; overflow-x: auto; overflow-y: auto">
            <table>
              <thead>
                <tr>
                  <th><small x-text="t('name')">Tên</small></th>
                  <th><small x-text="t('latitude')">Vĩ độ</small></th>
                  <th><small x-text="t('longitude')">Kinh độ</small></th>
                  <th><small x-text="t('height')">Độ cao</small></th>
                  <th><small x-text="t('actions')">Thao tác</small></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(pt, idx) in saved_base_points" :key="idx">
                  <tr>
                    <td><small x-text="pt.name"></small></td>
                    <td><small x-text="Number(pt.lat).toFixed(9)"></small></td>
                    <td><small x-text="Number(pt.lon).toFixed(9)"></small></td>
                    <td>
                      <small x-text="Number(pt.height).toFixed(4)"></small>
                    </td>
                    <td style="white-space: nowrap">
                      <button
                        style="
                          padding: 0.1rem 0.4rem;
                          font-size: 0.75rem;
                          margin-right: 0.25rem;
                          display: inline-block;
                          width: auto;
                        "
                        @click="baseApply(pt)"
                        x-text="t('apply')"
                      >
                        Áp dụng
                      </button>
                      <button
                        class="outline secondary"
                        style="
                          padding: 0.1rem 0.4rem;
                          font-size: 0.75rem;
                          display: inline-block;
                          width: auto;
                        "
                        @click="baseDelete(idx)"
                      >
                        X
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </details>

      <!-- NTRIP Caster, show when Base mode -->
      <details name="card_ntrip_server" open x-show="displayMode === 'base'">
        <summary role="button" class="outline contrast">
          <strong x-text="t('ntrip_caster')">NTRIP Caster</strong>
          <span x-text="status.ntrip_server_client_num"> </span>
          <span
            :class="ntrip_server_status_class"
            x-text="ntrip_server_status_text"
          ></span>
          <span
            :class="ntrip_server_status_class"
            x-text="ntrip_server_sent_bytes_text"
          ></span>
        </summary>

        <div
          class="grid"
          style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center"
        >
          <label x-text="t('host')">Máy chủ</label>
          <input :value="(status.wifi_ip_addr || '192.168.4.1')" readonly />

          <label x-text="t('port')">Cổng</label>
          <input value="2101" readonly />

          <label x-text="t('mountpoint')">Mountpoint</label>
          <input value="BASE" readonly />

          <label x-text="t('username')">Tài khoản</label>
          <input value="BASE" readonly />

          <label x-text="t('password')">Mật khẩu</label>
          <input value="BASE" readonly />
        </div>
      </details>

      <!-- PPP Settings, show when PPP mode -->
      <details name="card_ppp_settings" open x-show="displayMode === 'ppp'">
        <summary role="button" class="outline contrast">
          <strong x-text="t('ppp_settings')">Cài đặt PPP</strong>
          <button
            :class="'outline'"
            @click="setGnssMode('ppp')"
            x-text="t('activate_ppp_mode')"
          >
            Kích hoạt chế độ PPP
          </button>
        </summary>

        <div
          class="grid"
          style="grid-template-columns: 6rem 1fr; gap: 0; align-items: baseline"
        >
          <label x-text="t('duration')">Thời gian đo</label>
          <div
            class="grid"
            style="grid-template-columns: 1fr 4rem; align-items: baseline"
          >
            <input x-model="config.ppp_min_dur" />
            <span x-text="t('seconds')">giây</span>
          </div>

          <label x-text="t('accuracy')">Độ chính xác</label>
          <div
            class="grid"
            style="grid-template-columns: 1fr 4rem; align-items: baseline"
          >
            <input x-model="config.ppp_acc_limit" />
            <span>mm</span>
          </div>
        </div>
      </details>

      <!-- Logger, show when PPP mode -->
      <details name="card_logger" x-show="displayMode === 'ppp'">
        <summary role="button" class="outline contrast">
          <strong x-text="t('logger')">Ghi dữ liệu (Logger)</strong>
          <span :class="logger_status_class" x-text="logger_status_text"></span>
        </summary>

        <div
          class="grid"
          style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center"
        >
          <label x-text="t('log_file')">Tệp log</label>
          <input x-model="logger_file_text" readonly />

          <label x-text="t('log_size')">Dung lượng</label>
          <input :value="logger_size_text" readonly />

          <div></div>
          <div class="grid">
            <span></span>
            <button
              @click="loggerToggleLogging()"
              :class="'outline'"
              :disabled="!is_sdcard_mounted || Number(status.gnss_mode) !== 2"
              x-text="logger_button_text"
            ></button>
          </div>
        </div>
      </details>

      <!-- WiFi Settings, always show -->
      <details name="card_wifi">
        <summary role="button" class="outline contrast">
          <strong x-text="t('wifi')">WiFi</strong>
          <span :class="wifi_status_class" x-text="wifi_status_text"></span>
          <span x-text="status.wifi_ip_addr"></span>
        </summary>

        <div
          class="grid"
          style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center"
        >
          <label x-text="t('wifi_ap')">Tên WiFi</label>
          <input x-model="config.wifi_ssid" autocomplete="on" required />

          <label x-text="t('password')">Mật khẩu</label>
          <input x-model="config.wifi_password" autocomplete="on" required />
        </div>

        <div
          class="grid"
          style="grid-template-columns: 1fr 1fr; align-items: baseline"
        >
          <!-- Save WiFi Points to a file -->
          <button :class="'outline'" @click="wifiSave()" x-text="t('save')">
            Lưu
          </button>
          <button
            :class="'outline'"
            :disabled="is_wifi_connecting"
            @click="wifiConnect()"
            x-text="t('connect')"
          >
            Kết nối
          </button>
        </div>

        <hr />
        <!-- List of saved WiFi Points -->
        <template x-if="saved_wifi_list.length > 0">
          <div style="max-height: 14rem; overflow-x: auto; overflow-y: auto">
            <table>
              <thead>
                <tr>
                  <th><small>SSID</small></th>
                  <th><small x-text="t('password')">Mật khẩu</small></th>
                  <th><small x-text="t('actions')">Thao tác</small></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(w, idx) in saved_wifi_list" :key="idx">
                  <tr>
                    <td><small x-text="w.ssid"></small></td>
                    <td>
                      <small x-text="w.password"></small>
                    </td>
                    <td style="white-space: nowrap">
                      <button
                        style="
                          padding: 0.1rem 0.4rem;
                          font-size: 0.75rem;
                          margin-right: 0.25rem;
                          display: inline-block;
                          width: auto;
                        "
                        @click="wifiApply(w)"
                        x-text="t('apply')"
                      >
                        Áp dụng
                      </button>
                      <button
                        class="outline secondary"
                        style="
                          padding: 0.1rem 0.4rem;
                          font-size: 0.75rem;
                          display: inline-block;
                          width: auto;
                        "
                        @click="wifiDelete(idx)"
                      >
                        X
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </details>

      <!-- SDCard, always show -->
      <details name="card_sdcard">
        <summary role="button" class="outline contrast">
          <strong x-text="t('sdcard')">Thẻ nhớ SD</strong>
          <span :class="sdcard_status_class" x-text="sdcard_status_text"></span>
        </summary>

        <div style="max-height: 12rem; overflow-y: auto">
          <template x-if="sdcard_files.length === 0">
            <small x-text="t('no_log_files')"
              >Không tìm thấy tệp log nào.</small
            >
          </template>
          <template x-if="sdcard_files.length > 0">
            <table>
              <thead>
                <tr>
                  <th><small x-text="t('filename')">Tên tệp</small></th>
                  <th><small x-text="t('size_mb')">Dung lượng (MB)</small></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="file in sdcard_files" :key="file.name">
                  <tr>
                    <td><small x-text="file.name"></small></td>
                    <td>
                      <small x-text="(file.size / 1048576).toFixed(2)"></small>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
        </div>
      </details>

      <div
        class="grid"
        style="grid-template-columns: 6rem 1fr; gap: 0; align-items: baseline"
      >
        <label x-text="t('language')">Ngôn ngữ</label>
        <select x-model="lang">
          <option value="vi">Tiếng Việt</option>
          <option value="en">English</option>
        </select>
      </div>
    </main>

    <footer class="container">
      <nav>
        <ul>
          <li>
            <small>
              V<span x-text="config.version"></span>
              <span x-text="config.build_time"></span>
              <span x-text="config.git_commit"></span>
            </small>
          </li>
        </ul>
        <ul>
          <li>
            <small> <span x-text="status.bat_volt"></span>mV </small>
          </li>
        </ul>
      </nav>
    </footer>

    <script>
      const i18n = {
        vi: {
          language: "Ngôn ngữ",
          connecting_device: "Đang kết nối tới thiết bị...",
          gnss_position: "Tọa độ GNSS",
          latitude: "Vĩ độ",
          longitude: "Kinh độ",
          height: "Độ cao",
          time: "Thời gian",
          rover: "Trạm động (Rover)",
          base: "Trạm gốc (Base)",
          ppp: "Đo tĩnh (PPP)",
          rover_settings: "Cài đặt Rover",
          activate_rover_mode: "Kích hoạt chế độ Rover",
          ntrip_client: "NTRIP Client",
          server: "Máy chủ",
          port: "Cổng",
          mountpoint: "Mountpoint",

          base_settings: "Cài đặt Base",
          activate_base_mode: "Kích hoạt chế độ Base",
          use_current_position: "Dùng tọa độ hiện tại",
          name: "Tên",
          ntrip_caster: "NTRIP Caster",
          host: "Máy chủ (Host)",
          ppp_settings: "Cài đặt PPP",
          activate_ppp_mode: "Kích hoạt chế độ PPP",
          duration: "Thời gian đo",
          seconds: "giây",
          accuracy: "Độ chính xác",
          logger: "Ghi dữ liệu",
          log_file: "Tệp log",
          log_size: "Dung lượng",
          not_logging: "Không ghi dữ liệu",
          start_logging: "Bắt đầu ghi",
          stop_logging: "Dừng ghi",
          wifi: "WiFi",
          wifi_ap: "Tên WiFi",
          sdcard: "Thẻ nhớ SD",

          disconnected: "Đã ngắt kết nối",

          stopped: "Đã dừng",
          listening: "Đang chờ kết nối",

      document.addEventListener("alpine:init", () => {
        Alpine.data("app", () => ({
          lang: localStorage.getItem("app_lang") || "vi",
          config: {}, // fields are defined in config.c
          status: {}, // fields are defined in status.c
          heartbeat: true,
          message: "",
          displayMode: "rover", // default display mode
          sdcard_files: [],
          ntrip_mountpoints: [],
          saved_ntrip_clients: [],
          saved_base_points: [],
          saved_wifi_list: [],

          t(key, params = {}) {
            let str =
              (i18n[this.lang] && i18n[this.lang][key]) ||
              (i18n["vi"] && i18n["vi"][key]) ||
              key;
            for (const [k, v] of Object.entries(params)) {
              str = str.replace(new RegExp(`\\{${k}\\}`, "g"), v);
            }
            return str;
          },

          // Computed properties

          get bat_percent_text() {
            const volt = Number(this.status.bat_volt); // in range 1650-2100 mV
            return Math.max(
              0,
              Math.min(100, Math.round(((volt - 1650) / (2100 - 1650)) * 100)),
            );
          },

          get gnss_mode_text() {
            const modes = ["ROVER", "BASE", "PPP"];
            return modes[this.status.gnss_mode] ?? "Unknown";
          },

          get gnss_fix_class() {
            return this.status.gnss_fix === "FIXED RTK"
              ? "text-green"
              : this.status.gnss_fix === "FLOAT RTK"
                ? "text-orange"
                : "text-red";
          },

          get gnss_time_text() {
            const value = this.status.gnss_time;
            const match =
              /^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})$/.exec(value);

            if (!match) {
              return "---";
            }

            const [, year, month, day, hour, minute, second] = match;
            const t = new Date(
              Date.UTC(
                Number(year),
                Number(month) - 1,
                Number(day),
                Number(hour),
                Number(minute),
                Number(second),
              ),
            );

            return isNaN(t.getTime())
              ? "---"
              : t.toLocaleString(this.lang === "vi" ? "vi-VN" : "en-US", {
                  timeZone: "Asia/Ho_Chi_Minh",
                });
          },

          get gnss_lat_text() {
            const lat = Number(this.status.gnss_lat);
            return isNaN(lat) ? "---" : (lat * 1e-7).toFixed(9);
          },

          get gnss_lon_text() {
            const lon = Number(this.status.gnss_lon);
            return isNaN(lon) ? "---" : (lon * 1e-7).toFixed(9);
          },

          get gnss_height_text() {
            const height = Number(this.status.gnss_height);
            if (isNaN(height)) return "---";
            if (height >= 999999) return "---";
            return (height / 1000).toFixed(4);
          },

          get gnss_hacc_text() {
            const hacc = Number(this.status.gnss_hacc);
            if (isNaN(hacc)) return "---";
            if (hacc >= 9999) return "---";
            return (hacc / 1000).toFixed(3);
          },

          get gnss_vacc_text() {
            const vacc = Number(this.status.gnss_vacc);
            if (isNaN(vacc)) return "---";
            if (vacc >= 9999) return "---";
            return (vacc / 1000).toFixed(3);
          },

          get wifi_status_class() {
            const classes = ["text-red", "text-orange", "text-green"];
            return classes[this.status.wifi_status] ?? "text-red";
          },

          get wifi_status_text() {
            const keys = ["disconnected", "connecting", "connected"];
            return this.t(keys[this.status.wifi_status] ?? "disconnected");
          },

          get is_wifi_connecting() {
            return Number(this.status.wifi_status) === 1;
          },

          get ntrip_status_class() {
            const classes = ["text-red", "text-orange", "text-green"];
            return classes[this.status.ntrip_client_status] ?? "text-red";
          },

          get ntrip_client_status_text() {
            const keys = ["disconnected", "connecting", "connected"];
            return this.t(
              keys[this.status.ntrip_client_status] ?? "disconnected",
            );
          },

          get ntrip_received_bytes_text() {
            const bytes = Number(this.status.ntrip_received_bytes);
            if (isNaN(bytes)) return "";
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + " MB";
            return (bytes / 1024).toFixed(1) + " KB";
          },

          get is_ntrip_client_connecting() {
            return Number(this.status.ntrip_client_status) === 1;
          },

          get is_ntrip_connected() {
            return Number(this.status.ntrip_client_status) === 2;
          },

          get ntrip_button_text() {
            return this.is_ntrip_connected
              ? this.t("disconnect")
              : this.t("connect");
          },

          get ntrip_server_status_class() {
            const classes = ["text-red", "text-orange", "text-green"];
            return classes[this.status.ntrip_server_status] ?? "text-red";
          },

          get ntrip_server_status_text() {
            const keys = ["stopped", "listening", "streaming"];
            return this.t(keys[this.status.ntrip_server_status] ?? "stopped");
          },

          get ntrip_server_sent_bytes_text() {
            const bytes = Number(this.status.ntrip_sent_bytes);
            if (isNaN(bytes)) return "";
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + " MB";
            return (bytes / 1024).toFixed(1) + " KB";
          },

          get sdcard_status_class() {
            const classes = ["text-red", "text-green", "text-red"];
            return classes[this.status.sdcard_status] ?? "text-red";
          },

          get sdcard_status_text() {
            const keys = ["removed", "mounted", "error"];
            return this.t(keys[this.status.sdcard_status] ?? "unknown");
          },

          get logger_status_class() {
            const classes = ["text-orange", "text-green", "text-red"];
            return classes[this.status.logger_status] ?? "text-red";
          },

          get logger_status_text() {
            const keys = ["stopped", "logging", "error"];
            return this.t(keys[this.status.logger_status] ?? "unknown");
          },

          get logger_file_text() {
            return this.status.logger_file || this.t("not_logging");
          },

          get logger_size_text() {
            const bytes = Number(this.status.logger_size);
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + " MB";
            return (bytes / 1024).toFixed(1) + " KB";
          },

          get is_sdcard_mounted() {
            return Number(this.status.sdcard_status) === 1;
          },

          get logger_button_text() {
            return Number(this.status.logger_status) === 1
              ? this.t("stop_logging")
              : this.t("start_logging");
          },

          // Methods

          setMessage(msg) {
            this.message = msg;
            if (msg) window.scrollTo(0, 0);
          },

          confirmAction(key, params = {}) {
            return confirm(this.t(key, params));
          },

          setDisplayMode(mode) {
            // exception: no confirmation for switching display mode, it is just UI tabs
            this.displayMode = mode;
          },

          setBaseAtCurrentPosition() {
            if (!this.confirmAction("confirm_use_current_pos")) return;
            this.config.base_lat = this.status.gnss_lat * 1e-7;
            this.config.base_lon = this.status.gnss_lon * 1e-7;
            this.config.base_height = this.status.gnss_height / 1000;
          },

          async request(url, options = {}) {
            const opts = {
              ...options,
              signal: AbortSignal.timeout(5000),
              cache: "no-store",
            };
            try {
              const res = await fetch(url, opts);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.headers
                .get("content-type")
                ?.includes("application/json")
                ? await res.json()
                : true;
            } catch (err) {
              console.error(`Fetch failed (${url}):`, err);
              return null;
            }
          },

          async fetchConfig() {
            // send get request to /sysinfo with query is config
            const cfg = await this.request("/sysinfo?type=config");
            if (cfg) {
              this.config = cfg;
            }
          },

          async fetchStatus() {
            // send get request to /sysinfo with query is status
            const stt = await this.request("/sysinfo?type=status");
            if (stt) {
              this.status = stt;
              this.heartbeat = !this.heartbeat;
              this.setMessage("");
            } else {
              this.heartbeat = false;
              this.setMessage(this.t("err_connect_device"));
            }
          },

          async setGnssMode(req_mode) {
            if (!this.confirmAction(`confirm_set_${req_mode}`)) return;
            const payload = { mode: req_mode };
            if (req_mode === "base") {
              payload.lat = Number(this.config.base_lat);
              payload.lon = Number(this.config.base_lon);
              payload.height = Number(this.config.base_height);
            }
            if (req_mode === "ppp") {
              payload.min_dur = Number(this.config.ppp_min_dur);
              payload.acc_limit = Number(this.config.ppp_acc_limit);
            }
            const res = await this.request("/gnss", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (res) {
              this.setMessage("");
            } else {
              this.setMessage(this.t("err_gnss_mode"));
            }
          },

          async wifiConnect() {
            if (!this.confirmAction("confirm_wifi_connect")) return;
            const res = await this.request("/wifi", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                command: "connect",
                ssid: this.config.wifi_ssid,
                password: this.config.wifi_password,
              }),
            });
            if (res) {
              this.setMessage("");
            } else {
              this.setMessage(this.t("err_wifi_req"));
            }
          },

          async loggerToggleLogging() {
            const running = Number(this.status.logger_status) === 1;
            if (running) {
              if (!this.confirmAction("confirm_logger_stop")) return;
              const res = await this.request("/logger", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command: "stop" }),
              });
              if (res) {
                await this.fetchFiles();
              } else {
                this.setMessage(this.t("err_logger_stop"));
              }
            } else {
              if (!this.confirmAction("confirm_logger_start")) return;
              const pre = prompt(this.t("prompt_prefix"), "");

              // Generate filename with UTC+7 timestamp
              const value = this.status.gnss_time;
              const match =
                /^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})$/.exec(value);

              let filename;
              if (match) {
                const [, year, month, day, hour, minute, second] = match;
                const t = new Date(
                  Date.UTC(
                    Number(year),
                    Number(month) - 1,
                    Number(day),
                    Number(hour),
                    Number(minute),
                    Number(second),
                  ),
                );

                // Add 7 hours for UTC+7
                t.setHours(t.getHours() + 7);

                // Format as YYYY-MM-DD_HH-MM-SS
                const yyyy = t.getUTCFullYear();
                const mm = String(t.getUTCMonth() + 1).padStart(2, "0");
                const dd = String(t.getUTCDate()).padStart(2, "0");
                const hh = String(t.getUTCHours()).padStart(2, "0");
                const min = String(t.getUTCMinutes()).padStart(2, "0");
                const ss = String(t.getUTCSeconds()).padStart(2, "0");
                const timestamp = `${yyyy}-${mm}-${dd}_${hh}-${min}-${ss}`;

                // Build filename with optional prefix
                if (pre && pre.trim() !== "") {
                  filename = `${pre.trim()}_${timestamp}.ubx`;
                } else {
                  filename = `${timestamp}.ubx`;
                }
              } else {
                this.setMessage("Invalid GNSS time format");
                return;
              }

              const body = { command: "start", filename: filename };
              const res = await this.request("/logger", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
              });
              if (res) {
                await this.fetchFiles();
              } else {
                this.setMessage(this.t("err_logger_start"));
              }
            }
          },

          async fetchFiles() {
            const res = await this.request("/logger", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "list" }),
            });
            if (res && res.files) {
              // extract timestamp from filename and sort by timestamp descending
              this.sdcard_files = res.files.sort((a, b) => {
                const tsA = a.name.match(
                  /(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})/,
                );
                const tsB = b.name.match(
                  /(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})/,
                );
                if (!tsA || !tsB) return 0;
                const dateA = new Date(
                  `${tsA[1]}-${tsA[2]}-${tsA[3]}T${tsA[4]}:${tsA[5]}:${tsA[6]}Z`,
                );
                const dateB = new Date(
                  `${tsB[1]}-${tsB[2]}-${tsB[3]}T${tsB[4]}:${tsB[5]}:${tsB[6]}Z`,
                );
                return dateB - dateA;
              });
            }
          },

          async fetchNtripClientMountpoints() {
            const res = await this.request("/ntripclient", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "get" }),
            });
            if (res && res.mountpoints) {
              this.ntrip_mountpoints = res.mountpoints;
            }
          },

          async ntripClientQueryMountpoints() {
            if (!this.confirmAction("confirm_ntrip_query")) return;
            const res = await this.request("/ntripclient", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                command: "query",
                host: this.config.ntrip_server,
                port: Number(this.config.ntrip_port),
                username: this.config.ntrip_username,
                password: this.config.ntrip_password,
              }),
            });
            if (!res) {
              this.setMessage(this.t("err_ntrip_query"));
              return;
            }
            // Wait for async query to complete, then fetch mountpoints
            await new Promise((r) => setTimeout(r, 5000));
            await this.fetchNtripClientMountpoints();
          },

          async ntripClientToggleConnection() {
            if (this.is_ntrip_connected) {
              if (!this.confirmAction("confirm_ntrip_disconnect")) return;
              const res = await this.request("/ntripclient", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command: "disconnect" }),
              });
              if (!res) {
                this.setMessage(this.t("err_ntrip_disc"));
              }
            } else {
              if (!this.confirmAction("confirm_ntrip_connect")) return;
              const res = await this.request("/ntripclient", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  command: "connect",
                  host: this.config.ntrip_server,
                  port: Number(this.config.ntrip_port),
                  mountpoint: this.config.ntrip_mountpoint,
                  username: this.config.ntrip_username,
                  password: this.config.ntrip_password,
                }),
              });
              if (!res) {
                this.setMessage(this.t("err_ntrip_conn"));
              }
            }
          },

          async fetchNtripClientList() {
            const res = await this.request("/ntripclient", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "list" }),
            });
            if (res && res.ntripclient) {
              this.saved_ntrip_clients = res.ntripclient;
            }
          },

          async ntripClientSave() {
            if (
              !this.config.ntrip_server ||
              !this.config.ntrip_port ||
              !this.config.ntrip_mountpoint
            ) {
              this.setMessage(this.t("err_ntrip_required"));
              return;
            }
            if (!this.confirmAction("confirm_ntrip_save")) return;
            const res = await this.request("/ntripclient", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                command: "save",
                server: this.config.ntrip_server,
                port: Number(this.config.ntrip_port),
                mountpoint: this.config.ntrip_mountpoint,
                username: this.config.ntrip_username ?? "",
                password: this.config.ntrip_password ?? "",
              }),
            });
            if (res) {
              this.setMessage("");
              await this.fetchNtripClientList();
            } else {
              this.setMessage(this.t("err_ntrip_save"));
            }
          },

          ntripClientApply(item) {
            if (
              !this.confirmAction("confirm_apply_ntrip", {
                name: item.mountpoint,
              })
            )
              return;
            this.config.ntrip_server = item.server;
            this.config.ntrip_port = item.port;
            this.config.ntrip_mountpoint = item.mountpoint;
            this.config.ntrip_username = item.username ?? "";
            this.config.ntrip_password = item.password ?? "";
          },

          async ntripClientDelete(index) {
            const item = this.saved_ntrip_clients[index];
            const name = item?.mountpoint
              ? `"${item.mountpoint}"`
              : "this preset";
            if (!this.confirmAction("confirm_delete_ntrip", { name })) return;
            const res = await this.request("/ntripclient", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "delete", index: index }),
            });
            if (res) {
              await this.fetchNtripClientList();
            } else {
              this.setMessage(this.t("err_ntrip_delete"));
            }
          },

          async fetchBasePointsList() {
            const res = await this.request("/gnss", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "list" }),
            });
            if (res && res.gnss) {
              this.saved_base_points = res.gnss;
            }
          },

          async baseSave() {
            if (!this.confirmAction("confirm_base_save")) return;
            const name = prompt(
              this.t("prompt_base_name"),
              this.t("default_base_name"),
            );
            if (!name) return;
            const res = await this.request("/gnss", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                command: "save",
                name: name,
                lat: Number(this.config.base_lat),
                lon: Number(this.config.base_lon),
                height: Number(this.config.base_height),
              }),
            });
            if (res) {
              this.setMessage("");
              await this.fetchBasePointsList();
            } else {
              this.setMessage(this.t("err_base_save"));
            }
          },

          baseApply(pt) {
            if (!this.confirmAction("confirm_apply_base", { name: pt.name }))
              return;
            this.config.base_lat = pt.lat;
            this.config.base_lon = pt.lon;
            this.config.base_height = pt.height;
          },

          async baseDelete(index) {
            const pt = this.saved_base_points[index];
            const name = pt?.name ? `"${pt.name}"` : "this point";
            if (!this.confirmAction("confirm_delete_base", { name })) return;
            const res = await this.request("/gnss", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "delete", index: index }),
            });
            if (res) {
              await this.fetchBasePointsList();
            } else {
              this.setMessage(this.t("err_base_delete"));
            }
          },

          async fetchWifiList() {
            const res = await this.request("/wifi", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "list" }),
            });
            if (res && res.wifi) {
              this.saved_wifi_list = res.wifi;
            }
          },

          async wifiSave() {
            if (!this.config.wifi_ssid) {
              this.setMessage(this.t("err_wifi_required"));
              return;
            }
            if (!this.confirmAction("confirm_wifi_save")) return;
            const res = await this.request("/wifi", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                command: "save",
                ssid: this.config.wifi_ssid,
                password: this.config.wifi_password ?? "",
              }),
            });
            if (res) {
              this.setMessage("");
              await this.fetchWifiList();
            } else {
              this.setMessage(this.t("err_wifi_save"));
            }
          },

          wifiApply(w) {
            if (!this.confirmAction("confirm_apply_wifi", { ssid: w.ssid }))
              return;
            this.config.wifi_ssid = w.ssid;
            this.config.wifi_password = w.password ?? "";
          },

          async wifiDelete(index) {
            const w = this.saved_wifi_list[index];
            const name = w?.ssid ? `"${w.ssid}"` : "this network";
            if (!this.confirmAction("confirm_delete_wifi", { name })) return;
            const res = await this.request("/wifi", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command: "delete", index: index }),
            });
            if (res) {
              await this.fetchWifiList();
            } else {
              this.setMessage(this.t("err_wifi_delete"));
            }
          },

          async init() {
            this.$watch("lang", (val) => {
              localStorage.setItem("app_lang", val);
              document.documentElement.lang = val;
            });
            this.message = this.t("connecting_device");
            await this.fetchConfig();
            await this.fetchStatus();
            setTimeout(() => this.fetchFiles(), 1000);
            setTimeout(() => this.fetchNtripClientMountpoints(), 1500);
            setTimeout(() => this.fetchNtripClientList(), 2000);
            setTimeout(() => this.fetchBasePointsList(), 2500);
            setTimeout(() => this.fetchWifiList(), 3000);
            setInterval(() => this.fetchStatus(), 3000);
          },
        }));
      });
    </script>
  </body>
</html>
