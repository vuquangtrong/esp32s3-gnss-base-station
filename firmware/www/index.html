<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GNSS Station</title>
    <link rel="stylesheet" href="/pico.min.css" />
    <script defer src="/alpine.min.js"></script>
    <style>
      :root {
        --pico-spacing: 0.5rem;
        --pico-nav-element-spacing-vertical: var(--pico-spacing);
        --pico-nav-element-spacing-horizontal: var(--pico-spacing);
        --pico-form-element-spacing-vertical: var(--pico-spacing);
        --pico-form-element-spacing-horizontal: var(--pico-spacing);
      }

      @media only screen and (prefers-color-scheme: dark) {
        img.battery {
          filter: invert(1) hue-rotate(180deg);
        }
      }

      header {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
      }

      summary {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      summary > :nth-child(2) {
        margin-left: auto;
      }

      input,
      select {
        font-weight: bold;
      }

      .text-green {
        color: green;
      }

      .text-orange {
        color: darkorange;
      }

      .text-red {
        color: red;
      }

      .notification {
        color: red;
        background-color: lightyellow;
        border: solid 1px red;
        padding: var(--pico-spacing);
        white-space: pre-line;
      }
    </style>
  </head>

  <body x-data="app">
    <template x-if="message">
      <div class="container notification" x-text="message"></div>
    </template>

    <!-- Status Bar -->
    <header class="container">
      <nav>
        <ul>
          <li>
            <kbd><span x-text="gnss_mode_text"></span></kbd>
            <svg
              x-show="heartbeat"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="8" cy="8" r="8" fill="darkcyan" />
            </svg>
          </li>
        </ul>
        <ul>
          <li>
            <strong :class="gnss_fix_class" x-text="status.gnss_fix"></strong>
          </li>
          <li>
            <span x-text="status.gnss_sat"></span>
            <img src="/favicon.ico" width="24" height="24" />
          </li>
          <li>
            <span x-text="bat_percent_text"></span>%
            <img
              class="battery"
              x-bind:src="bat_percent_icon"
              width="24"
              height="24"
            />
          </li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <!-- GNSS Position -->
      <details name="card_gnss_position" open>
        <summary role="button" class="outline contrast">
          <strong>GNSS Position</strong>
          <span></span>
        </summary>

        <form>
          <div
            class="grid"
            style="
              grid-template-columns: 6rem 2fr 0.5rem 1fr;
              gap: 0;
              align-items: center;
            "
          >
            <span>Latitude</span>
            <input x-bind:value="status.gnss_lat" readonly />
            <div></div>
            <span>deg</span>

            <!---->
            <span>Longitude</span>
            <input x-bind:value="status.gnss_lon" readonly />
            <div></div>
            <span>deg</span>

            <!---->
            <span>Altitude</span>
            <input x-bind:value="status.gnss_alt" readonly />
            <div></div>
            <span>m</span>

            <!---->
            <span>Accuracy</span>
            <div
              class="grid"
              style="
                grid-template-columns: 2rem 1fr 2rem 1fr;
                gap: 0;
                align-items: center;
              "
            >
              <span>H</span>
              <span
                x-text="status.gnss_hacc <= 999 ? status.gnss_hacc : '---'"
              ></span>
              <span>V</span>
              <span
                x-text="status.gnss_vacc <= 999 ? status.gnss_vacc : '---'"
              ></span>
            </div>
            <div></div>
            <span>m</span>

            <!---->
            <span>Datetime</span>
            <div
              class="grid"
              style="
                grid-template-columns: 1fr 1fr;
                gap: 0;
                align-items: center;
              "
            >
              <span x-text="gnss_date_text"></span>
              <span x-text="gnss_time_text"></span>
            </div>
            <div></div>
            <span></span>
          </div>
        </form>
      </details>

      <!-- WiFi Settings -->
      <details name="card_wifi_settings" open>
        <summary role="button" class="outline contrast">
          <strong>WiFi Settings</strong>
          <span :class="sta_status_class" x-text="sta_status_text"></span>
          <span x-text="status.sta_ip"></span>
        </summary>

        <form @submit.prevent="wifiConnect()">
          <div
            class="grid"
            style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center"
          >
            <label for="ssid">WiFi AP</label>
            <input
              id="ssid"
              x-model="config.wifi_ssid"
              autocomplete="on"
              required
            />

            <label for="password">Password</label>
            <input
              id="password"
              x-model="config.wifi_password"
              autocomplete="on"
              required
            />

            <div></div>
            <div class="grid" style="grid-template-columns: 1fr 1fr">
              <div></div>
              <button type="submit" :disabled="is_sta_connecting">
                Connect
              </button>
            </div>
          </div>
        </form>
      </details>

      <!-- NTRIP Client Settings -->
      <details name="card_ntrip_client_settings" open>
        <summary role="button" class="outline contrast">
          <strong>NTRIP Client</strong>
          <span
            :class="ntrip_client_status_class"
            x-text="ntrip_client_status_text"
          ></span>
          <span x-text="ntrip_received_bytes_text"></span>
        </summary>

        <form @submit.prevent="ntripClientToggle()">
          <div
            class="grid"
            style="grid-template-columns: 6rem 1fr; gap: 0; align-items: center"
          >
            <label for="ntrip_server">Ntrip Server</label>
            <input
              id="ntrip_server"
              x-model="config.ntrip_server"
              autocomplete="on"
              required
            />

            <label for="ntrip_port">Ntrip Port</label>
            <input
              id="ntrip_port"
              x-model="config.ntrip_port"
              autocomplete="on"
              required
            />

            <label for="ntrip_mountpoint">Mountpoint</label>
            <select id="ntrip_mountpoint" x-model="config.ntrip_mountpoint">
              <option
                :value="config.ntrip_mountpoint"
                x-text="config.ntrip_mountpoint"
              ></option>
              <template x-for="mp in status.ntrip_mountpoints" :key="mp">
                <option :value="mp" x-text="mp"></option>
              </template>
            </select>

            <label for="ntrip_username">Username</label>
            <input
              id="ntrip_username"
              x-model="config.ntrip_username"
              autocomplete="on"
              required
            />

            <label for="ntrip_password">Password</label>
            <input
              id="ntrip_password"
              x-model="config.ntrip_password"
              autocomplete="on"
              required
            />

            <div></div>
            <div class="grid" style="grid-template-columns: 1fr 1fr">
              <button
                class="secondary"
                type="button"
                @click="ntripFetchMountpoints()"
              >
                Mountpoints
              </button>
              <button
                type="submit"
                x-text="is_ntrip_streaming ? 'Stop Streaming' : 'Start Streaming'"
              ></button>
            </div>
          </div>
        </form>
      </details>
    </main>

    <footer class="container">
      <nav>
        <ul>
          <li>
            <small>
              V<span x-text="config.prj_version"></span>
              <span x-text="config.build_date"></span>
              <span x-text="config.git_commit"></span>
            </small>
          </li>
        </ul>
        <ul>
          <li>
            <small> <span x-text="status.bat_volt"></span>mV </small>
          </li>
        </ul>
      </nav>
    </footer>

    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("app", () => ({
          config: {},
          status: {},
          heartbeat: false,
          message: "",

          setMessage(msg) {
            this.message = msg;
            if (msg) window.scrollTo(0, 0);
          },

          get bat_percent_text() {
            const volt = Number(this.status.bat_volt); // in range 1650-2100 mV
            return Math.max(
              0,
              Math.min(100, Math.round(((volt - 1650) / (2100 - 1650)) * 100)),
            );
          },

          get bat_percent_icon() {
            const volt = Number(this.status.bat_volt); // in range 1650-2100 mV
            if (volt >= 2000) return "/bat_100.png";
            if (volt >= 1900) return "/bat_75.png";
            if (volt >= 1800) return "/bat_50.png";
            if (volt >= 1700) return "/bat_25.png";
            return "/bat_0.png";
          },

          get gnss_fix_class() {
            return this.status.gnss_fix === "FIXED RTK"
              ? "text-green"
              : this.status.gnss_fix === "FLOAT RTK"
                ? "text-orange"
                : "text-red";
          },

          get gnss_mode_text() {
            const modes = ["ROVER", "BASE", "PPP"];
            return modes[this.status.gnss_mode] ?? "Unknown";
          },

          get sta_status_class() {
            const classes = ["text-red", "text-orange", "text-green"];
            return classes[this.status.sta_status] ?? "text-red";
          },

          get sta_status_text() {
            const statuses = ["Disconnected", "Connecting...", "Connected"];
            return statuses[this.status.sta_status] ?? "Disconnected";
          },

          get gnss_date_text() {
            // status.gnss_date and status.gnss_time is in UTC, should display in UTC+7
            if (!this.status.gnss_date) return "---";
            const utcDate = new Date(
              `${this.status.gnss_date}T${this.status.gnss_time}Z`,
            );
            const localDate = new Date(utcDate.getTime() + 7 * 60 * 60 * 1000); // UTC+7
            return localDate.toISOString().substr(0, 10);
          },

          get gnss_time_text() {
            // status.gnss_date and status.gnss_time is in UTC, should display in UTC+7
            if (!this.status.gnss_time) return "---";
            const utcTime = new Date(
              `${this.status.gnss_date}T${this.status.gnss_time}Z`,
            );
            const localTime = new Date(utcTime.getTime() + 7 * 60 * 60 * 1000); // UTC+7
            return localTime.toISOString().substr(11, 8);
          },

          get is_sta_connecting() {
            return Number(this.status.sta_status) === 1;
          },

          get is_ntrip_streaming() {
            return Number(this.status.ntrip_client_status) === 2;
          },

          get ntrip_client_status_class() {
            const classes = ["text-red", "text-orange", "text-green"];
            return classes[this.status.ntrip_client_status] ?? "text-red";
          },

          get ntrip_client_status_text() {
            const statuses = ["Disconnected", "Connecting...", "Connected"];
            return statuses[this.status.ntrip_client_status] ?? "Disconnected";
          },

          get ntrip_received_bytes_text() {
            const bytes = Number(this.status.ntrip_received_bytes);
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(0)} MB`;
          },

          async request(url, options = {}) {
            const opts = {
              ...options,
              signal: AbortSignal.timeout(5000),
              cache: "no-store",
            };
            try {
              const res = await fetch(url, opts);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.headers
                .get("content-type")
                ?.includes("application/json")
                ? await res.json()
                : true;
            } catch (err) {
              console.error(`Fetch failed (${url}):`, err);
              return null;
            }
          },

          async fetchConfig() {
            const data = await this.request("/config");
            console.log("Fetched config:", data);
            if (data) this.config = data;
          },

          async fetchStatus() {
            const data = await this.request("/status");
            console.log("Fetched status:", data);
            if (data) {
              this.status = data;
              this.heartbeat = !this.heartbeat;
              this.setMessage("");
            } else {
              this.status = {};
              this.heartbeat = false;
              this.setMessage(
                "Cannot connect to server.\nPlease check your connection.",
              );
            }
          },

          async wifiConnect() {
            const params = new URLSearchParams({
              command: "connect",
              ssid: this.config.wifi_ssid || "",
              password: this.config.wifi_password || "",
            });
            this.status.sta_status = 1;
            this.setMessage(
              "You may need to connect to the device's WiFi\nor the WiFi this device connects to.",
            );
            await this.request(`/wifi?${params}`, { method: "POST" });
          },

          async ntripFetchMountpoints() {
            const params = new URLSearchParams({
              command: "mountpoints",
              host: this.config.ntrip_server || "",
              port: this.config.ntrip_port || "",
              username: this.config.ntrip_username || "",
              password: this.config.ntrip_password || "",
            });
            await this.request(`/ntripclient?${params}`, { method: "POST" });
          },

          async ntripClientToggle() {
            if (this.is_ntrip_streaming) {
              await this.ntripClientDisconnect();
            } else {
              await this.ntripClientConnect();
            }
          },

          async ntripClientConnect() {
            const params = new URLSearchParams({
              command: "connect",
              host: this.config.ntrip_server || "",
              port: this.config.ntrip_port || "",
              mountpoint: this.config.ntrip_mountpoint || "",
              username: this.config.ntrip_username || "",
              password: this.config.ntrip_password || "",
            });
            this.status.ntrip_client_status = 1;
            await this.request(`/ntripclient?${params}`, { method: "POST" });
          },

          async ntripClientDisconnect() {
            const params = new URLSearchParams({
              command: "disconnect",
            });
            await this.request(`/ntripclient?${params}`, { method: "POST" });
          },

          async init() {
            await this.fetchConfig();
            await this.fetchStatus();
            setInterval(() => this.fetchStatus(), 3000);
          },
        }));
      });
    </script>
  </body>
</html>
