<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSS Station</title>
    <link rel="stylesheet" href="/pico.min.css">
    <script defer src="/alpine.min.js"></script>
    <style>
        :root {
            --pico-spacing: 0.5rem;
            --pico-nav-element-spacing-vertical: var(--pico-spacing);
            --pico-nav-element-spacing-horizontal: var(--pico-spacing);
            --pico-form-element-spacing-vertical: var(--pico-spacing);
            --pico-form-element-spacing-horizontal: var(--pico-spacing);
        }

        .text-green {
            color: green;
        }

        .text-orange {
            color: darkorange;
        }

        .text-red {
            color: red;
        }

        .notification {
            color: red;
            background-color: lightyellow;
            border: solid 1px red;
            padding: var(--pico-spacing);
            white-space: pre-line;
        }
    </style>
</head>

<body x-data="{ sys: $store.system }">
    <template x-if="sys.notification_message">
        <div class="notification" x-text="sys.notification_message"></div>
    </template>

    <header class="container">
        <nav>
            <ul>
                <li><strong>GNSS Station</strong></li>
            </ul>
            <ul>
                <li><svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="8" cy="8" r="8" fill="currentColor" />
                    </svg>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <nav>
                <ul>
                    <li><strong>WiFi Settings</strong></li>
                </ul>
                <ul>
                    <li :class="sys.status.sta_status === '2' ? 'text-green' : sys.status.sta_status === '1' ? 'text-orange' : 'text-red'"
                        x-text="sys.status.sta_status === '2' ? 'Connected' : sys.status.sta_status === '1' ? 'Connecting...' : 'Disconnected'">
                    </li>
                </ul>
            </nav>
            <form @submit.prevent="sys.wifiConnect()">
                <div class="grid" style="grid-template-columns: 5rem 1fr; gap: 0; align-items: center;">
                    <label for="ssid">WiFi AP</label>
                    <input id="ssid" x-model="sys.config.wifi_ssid" autocomplete="on" required />

                    <label for="password">Password</label>
                    <input id="password" x-model="sys.config.wifi_password" autocomplete="on" required />

                    <div></div>
                    <button type="submit" :disabled="sys.status.sta_status === '1'">Connect</button>
                </div>
            </form>
        </article>
    </main>

    <footer class="container">
        <nav>
            <ul>
                <li>Version <span x-text="sys.config.prj_version || '...'"></span></li>
            </ul>
            <ul>
                <li><span x-text="sys.config.build_date || '...'"></span>
                    (<span x-text="sys.config.git_commit || '...'"></span>)</li>
            </ul>
        </nav>
    </footer>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('system', {
                config: {},
                status: {},
                notification_message: '',

                setNotification(message) {
                    this.notification_message = message;
                    if (message) {
                        window.scrollTo(0, 0);
                    }
                },

                async request(url, options = {}) {
                    try {
                        const res = await fetch(url, options);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.headers.get('content-type')?.includes('application/json') ? await res.json() : true;
                    } catch (err) {
                        console.error(`Fetch failed (${url}):`, err);
                        return null;
                    }
                },

                async wifiConnect() {
                    const params = new URLSearchParams({
                        ssid: this.config.wifi_ssid || '',
                        password: this.config.wifi_password || ''
                    });
                    this.status.sta_status = '1';
                    await this.request(`/wifi/connect?${params}`, { method: "POST" });
                },

                async fetchConfig() {
                    const data = await this.request("/config");
                    if (data) this.config = data;
                },

                async fetchStatus() {
                    const data = await this.request("/status");
                    console.log('Fetched status:', data);
                    if (data) {
                        this.status = data;
                        this.setNotification('');
                    } else {
                        this.status = {};
                        this.setNotification('Cannot connect to server.\nPlease check your connection.');
                    }
                },

                async init() {
                    await this.fetchConfig();
                    await this.fetchStatus();
                    setInterval(() => this.fetchStatus(), 5000);
                }
            });
        });
    </script>
</body>

</html>
